<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산업경영공학과 학점 관리</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --txt:#1c2333; --sub:#6b7590;
  --blue:#2563eb; --green:#16a34a; --orange:#ea580c; --purple:#9333ea; --teal:#0d9488; --gray:#64748b;
  --red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{background:var(--bg);color:var(--txt);padding:24px 16px;max-width:1080px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:#e9edf5;padding:4px;border-radius:12px;width:fit-content}
.tabs button{border:none;background:none;font-size:14px;font-weight:600;padding:9px 20px;border-radius:9px;cursor:pointer;color:var(--sub);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card .label{font-size:12px;color:var(--sub);margin-bottom:6px}
.card .val{font-size:26px;font-weight:700}
.card .val small{font-size:13px;color:var(--sub);font-weight:400}
section{margin-top:24px}
h2{font-size:16px;margin-bottom:12px}
.bar-row{margin-bottom:14px}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px;flex-wrap:wrap}
.bar-head b{font-weight:600}
.bar{height:10px;background:#e9edf5;border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
.done{color:var(--green);font-weight:600}
.plan-txt{color:var(--orange);font-weight:600}
form{display:grid;grid-template-columns:1.2fr 2fr .8fr 1fr 1fr auto;gap:8px;align-items:end}
@media(max-width:760px){form{grid-template-columns:1fr 1fr}}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
input,select,button{font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
button{cursor:pointer;border:none;font-weight:600}
.btn-add{background:var(--blue);color:#fff;white-space:nowrap}
.btn-ghost{background:#eef2f8;color:var(--txt);width:auto;font-size:13px;padding:8px 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--sub);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:8px;border-bottom:1px solid #eef1f6}
td select{width:auto;padding:5px 8px;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.sem-title{margin:18px 0 8px;font-size:14px;font-weight:700;color:#334}
.sem-title span{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:8px}
.del{background:none;color:#c0c7d4;font-size:16px;width:auto;padding:2px 6px}
.del:hover{color:var(--red)}
.empty{color:var(--sub);font-size:14px;padding:24px;text-align:center}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:10px}
.io{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* 수강계획 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{width:auto;font-size:13px;padding:7px 14px;border-radius:99px;background:#eef2f8;color:var(--sub);font-weight:600}
.chip.on{background:var(--txt);color:#fff}
.cat-list{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eef1f6;font-size:14px}
.cat-item:last-child{border-bottom:none}
.cat-item .nm{flex:1;min-width:0}
.cat-item .meta{font-size:12px;color:var(--sub)}
.cat-item button{width:auto;font-size:12.5px;padding:6px 12px;border-radius:99px;white-space:nowrap}
.b-pick{background:var(--blue);color:#fff}
.b-done{background:#e8f7ee;color:var(--green);cursor:default}
.b-in{background:#fdeee3;color:var(--orange);cursor:default}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media(max-width:600px){
  body{padding:14px 10px}
  .cards{grid-template-columns:1fr 1fr}
  .card{padding:13px;border-radius:12px}
  .card .val{font-size:21px}
  form{grid-template-columns:1fr 1fr}
  form>div:nth-child(2){grid-column:1/-1}
  table{font-size:13px}
  th,td{padding:6px 4px}
  td select{padding:4px 4px;font-size:12px}
  input,select,button{font-size:16px}
  .tabs button{padding:8px 14px}
}
</style>
</head>
<body>
<h1>산업경영공학과 학점 관리</h1>

<div class="tabs">
  <button id="tabBtn0" class="on" onclick="showTab(0)">📊 이수 현황</button>
  <button id="tabBtn1" onclick="showTab(1)">🗓️ 수강 계획</button>
  <button id="tabBtn2" onclick="showTab(2)">📚 커리큘럼</button>
</div>

<!-- ===== 탭 1: 이수 현황 ===== -->
<div id="tab0">
<div class="grid cards">
  <div class="card"><div class="label">총 취득학점</div><div class="val" id="totCr">0<small> / 130</small></div></div>
  <div class="card"><div class="label">전체 평점</div><div class="val" id="gpaAll">-<small> / 4.5</small></div></div>
  <div class="card"><div class="label">전공 평점</div><div class="val" id="gpaMaj">-<small> / 4.5</small></div></div>
  <div class="card"><div class="label">이수 과목 수</div><div class="val" id="cnt">0<small> 과목</small></div></div>
</div>

<section class="card">
  <h2>졸업요건 현황</h2>
  <div id="bars"></div>
</section>

<section class="card">
  <h2>과목 추가</h2>
  <form id="f" onsubmit="return addCourse(event)">
    <div><label>학기</label><select id="fSem"></select></div>
    <div><label>과목명 (목록에서 선택하거나 직접 입력)</label><input id="fName" list="catalog" placeholder="과목명 검색..." required autocomplete="off"></div>
    <div><label>학점</label><input id="fCr" type="number" min="0.5" max="18" step="0.5" value="3" required></div>
    <div><label>이수구분</label><select id="fType"></select></div>
    <div><label>성적</label><select id="fGrade"></select></div>
    <button class="btn-add" type="submit">추가</button>
  </form>
  <datalist id="catalog"></datalist>
</section>

<section class="card">
  <h2>수강 내역</h2>
  <div id="list"><div class="empty">아직 추가한 과목이 없어요.</div></div>
  <div class="io">
    <button class="btn-ghost" onclick="exportData()">백업 내보내기</button>
    <button class="btn-ghost" onclick="document.getElementById('imp').click()">백업 불러오기</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn-ghost" onclick="if(confirm('처음 설정해둔 이수 내역으로 되돌릴까요? 직접 수정한 내용은 사라집니다.')){loadDefaults();renderAll()}">기본값으로 되돌리기</button>
    <button class="btn-ghost" style="color:var(--red)" onclick="if(confirm('이수 내역을 모두 삭제할까요?')){db=[];save();renderAll()}">전체 비우기</button>
  </div>
</section>
</div>

<!-- ===== 탭 2: 수강 계획 ===== -->
<div id="tab1" style="display:none">

<section class="card" style="margin-top:0">
  <h2>계획 반영 졸업요건 시뮬레이션</h2>
  <div class="legend"><span><i style="background:var(--blue)"></i>이수 완료</span><span><i style="background:#fbbf77"></i>수강 계획</span></div>
  <div id="planBars"></div>
  <div class="note" id="planSummary"></div>
</section>

<section class="card">
  <h2>과목 찾아서 담기</h2>
  <div class="filters" id="typeChips"></div>
  <div class="filters">
    <input id="pSearch" placeholder="과목명 검색..." style="flex:1;min-width:150px" oninput="renderCat()">
    <select id="pSem" style="width:auto" onchange="renderCat()"></select>
  </div>
  <div class="cat-list" id="catList"></div>
</section>

<section class="card">
  <h2>목록에 없는 과목 직접 담기</h2>
  <form onsubmit="return addPlanCustom(event)" style="grid-template-columns:1fr 2fr .8fr 1fr auto">
    <div><label>학기</label><select id="pfSem"></select></div>
    <div><label>과목명</label><input id="pfName" placeholder="예: 교양 영어회화" required autocomplete="off"></div>
    <div><label>학점</label><input id="pfCr" type="number" min="0.5" max="18" step="0.5" value="3" required></div>
    <div><label>이수구분</label><select id="pfType"></select></div>
    <button class="btn-add" type="submit">담기</button>
  </form>
</section>

<section class="card">
  <h2>나의 수강 계획</h2>
  <div id="planList"><div class="empty">아직 담은 과목이 없어요. 위에서 과목을 담아보세요!</div></div>
  <div class="io">
    <button class="btn-ghost" onclick="if(confirm('처음 설정해둔 3-1~4-1 수강 계획으로 되돌릴까요?')){plan=DEFAULT_PLAN.map(c=>({...c}));saveP();renderPlanAll()}">기본 계획으로 되돌리기</button>
    <button class="btn-ghost" style="color:var(--red)" onclick="if(confirm('수강 계획을 모두 비울까요?')){plan=[];saveP();renderPlanAll()}">계획 비우기</button>
  </div>
</section>
</div>

<!-- ===== 탭 3: 커리큘럼 ===== -->
<div id="tab2" style="display:none">

</div>

const FUSION_SET=new Set(CATALOG.filter(c=>c[4]).map(c=>c[0]));
function isDual(c){return c.type!=="융선"&&(FUSION_SET.has(c.name)||c.fu);}
// 중복인정 체크된 과목을 한도(FUSION_CAP) 내에서 융합전공으로 "이관"한다.
// 이관된 과목의 학점은 원래 이수구분(기본전공/교양/특화) 집계에서 빠진다.
// 한도를 넘어선 과목은 이관되지 않고 원래 이수구분에 그대로 남는다.
function fuAlloc(){
  let rem=FUSION_CAP;
  const takenIds=new Set(),planIds=new Set();
  let takenCr=0,planCr=0,overCr=0;
  db.filter(c=>c.fu&&c.type!=="융선"&&c.grade!=="F"&&c.grade!=="NP").forEach(c=>{
    if(rem>=c.cr){takenIds.add(c.id);takenCr+=c.cr;rem-=c.cr;}else{overCr+=c.cr;}
  });
  plan.filter(p=>p.fu&&p.type!=="융선").forEach(p=>{
    if(rem>=p.cr){planIds.add(p.id);planCr+=p.cr;rem-=p.cr;}else{overCr+=p.cr;}
  });
  return {takenIds,planIds,takenCr,planCr,overCr};
}

function gpa(list){
  let pts=0,crs=0;
  list.forEach(c=>{const p=GRADES[c.grade];if(p!==null&&p!==undefined){pts+=p*c.cr;crs+=c.cr;}});
  return crs?(pts/crs):null;
}
function fmt(g){return g===null?"-":g.toFixed(2);}
function earned(list){return list.filter(c=>c.grade!=="F"&&c.grade!=="NP").reduce((s,c)=>s+c.cr,0);}

function render(){
  const tot=earned(db);
  $("totCr").innerHTML=`${tot}<small> / ${TOTAL_NEED}</small>`;
  $("gpaAll").innerHTML=`${fmt(gpa(db))}<small> / 4.5</small>`;
  $("gpaMaj").innerHTML=`${fmt(gpa(db.filter(c=>MAJOR_TYPES.includes(c.type))))}<small> / 4.5</small>`;
  $("cnt").innerHTML=`${db.length}<small> 과목</small>`;
  let bars="";
  const A=fuAlloc();
  REQS.forEach(r=>{
    const rlist=db.filter(c=>r.types.includes(c.type));
    let got=earned(rlist);
    let extra="";
    if(r.types.includes("융선")){
      if(A.takenCr){got+=A.takenCr;extra=` <span style="color:var(--sub)">(중복인정 +${A.takenCr} 포함)</span>`;}
    }else{
      const moved=earned(rlist.filter(c=>A.takenIds.has(c.id)));
      if(moved){got-=moved;extra=` <span style="color:var(--sub)">(중복인정 −${moved} 제외)</span>`;}
    }
    if(r.need===0&&got===0)return;
    const pct=r.need?Math.min(100,got/r.need*100):(got?100:0);
    const ok=r.need&&got>=r.need;
    bars+=`<div class="bar-row"><div class="bar-head"><b>${r.key}</b><span>${got}${r.need?` / ${r.need}학점`:"학점"}${extra} ${ok?'<span class="done">✓ 충족</span>':r.need?`(${Math.max(0,r.need-got)}학점 남음)`:""}</span></div><div class="bar"><i style="width:${pct}%;background:${r.color};border-radius:99px"></i></div></div>`;
  });
  if(A.overCr)bars+=`<div class="note" style="color:var(--orange)">⚠ 중복인정 한도(${FUSION_CAP}학점)를 넘은 ${A.overCr}학점은 융합전공으로 이관되지 않고 원래 이수구분에 남아 있습니다.</div>`;
  const tpct=Math.min(100,tot/TOTAL_NEED*100),tok=tot>=TOTAL_NEED;
  bars+=`<div class="bar-row" style="margin-top:20px;padding-top:14px;border-top:1px dashed var(--line)"><div class="bar-head"><b>총 취득학점</b><span>${tot} / ${TOTAL_NEED}학점 ${tok?'<span class="done">✓ 충족</span>':`(${TOTAL_NEED-tot}학점 남음)`}</span></div><div class="bar" style="height:14px"><i style="width:${tpct}%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px"></i></div></div>`;
  $("bars").innerHTML=bars;

  if(!db.length){$("list").innerHTML='<div class="empty">아직 추가한 과목이 없어요.</div>';return;}
  let html="";
  SEMS.forEach(s=>{
    const list=db.filter(c=>c.sem===s);
    if(!list.length)return;
    html+=`<div class="sem-title">${semLabel(s)}<span>${earned(list)}학점 · 평점 ${fmt(gpa(list))}</span></div>
    <table><tr><th style="width:38%">과목명</th><th>이수구분</th><th>학점</th><th>성적</th><th></th></tr>`;
    list.forEach(c=>{
      const fuChk=isDual(c)?`<div style="font-size:11px;margin-top:2px"><label title="체크하면 이 과목 학점이 원래 이수구분에서 빠지고 융합전공 학점으로 계산됩니다 (한도 ${FUSION_CAP}학점)" style="display:inline;color:var(--orange);cursor:pointer"><input type="checkbox" style="width:auto;vertical-align:-2px" ${c.fu?"checked":""} onchange="toggleFu(${c.id})"> 융합전공 중복인정</label></div>`:"";
      html+=`<tr><td>${c.name}${fuChk}</td>
      <td><select onchange="chType(${c.id},this.value)" style="color:${TYPE_COLOR[c.type]};font-weight:600">${TYPES.map(t=>`<option ${t===c.type?"selected":""}>${t}</option>`).join("")}</select></td>
      <td>${c.cr}</td>
      <td><select onchange="chGrade(${c.id},this.value)">${Object.keys(GRADES).map(g=>`<option ${g===c.grade?"selected":""}>${g}</option>`).join("")}</select></td>
      <td><button class="del" onclick="delCourse(${c.id})" title="삭제">✕</button></td></tr>`;
    });
    html+="</table>";
  });
  $("list").innerHTML=html;
}

function renderPlan(){
  let bars="";
  const A=fuAlloc();
  REQS.forEach(r=>{
    const rlist=db.filter(c=>r.types.includes(c.type));
    const plist=plan.filter(c=>r.types.includes(c.type));
    let got=earned(rlist);
    let pl=plist.reduce((s,c)=>s+c.cr,0);
    if(r.types.includes("융선")){
      got+=A.takenCr;pl+=A.planCr;
    }else{
      got-=earned(rlist.filter(c=>A.takenIds.has(c.id)));
      pl-=plist.filter(c=>A.planIds.has(c.id)).reduce((s,c)=>s+c.cr,0);
    }
    if(r.need===0&&got===0&&pl===0)return;
    const base=r.need||Math.max(got+pl,1);
    const gp=Math.min(100,got/base*100);
    const pp=Math.min(100-gp,pl/base*100);
    const okNow=r.need&&got>=r.need;
    const okPlan=r.need&&got+pl>=r.need;
    let status=okNow?'<span class="done">✓ 충족</span>':okPlan?'<span class="plan-txt">✓ 계획대로면 충족</span>':r.need?`(${r.need-got-pl}학점 더 필요)`:"";
    bars+=`<div class="bar-row"><div class="bar-head"><b>${r.key}</b><span>${got}${pl?` <span class="plan-txt">+${pl}</span>`:""}${r.need?` / ${r.need}학점`:"학점"} ${status}</span></div>
    <div class="bar"><i style="width:${gp}%;background:${r.color};border-radius:99px 0 0 99px"></i><i style="width:${pp}%;background:#fbbf77"></i></div></div>`;
  });
  if(A.overCr)bars+=`<div class="note" style="color:var(--orange)">⚠ 중복인정 한도(${FUSION_CAP}학점)를 넘은 ${A.overCr}학점은 융합전공으로 이관되지 않고 원래 이수구분에 남아 있습니다.</div>`;
  const tot=earned(db),ptot=plan.reduce((s,c)=>s+c.cr,0);
  const gp=Math.min(100,tot/TOTAL_NEED*100),pp=Math.min(100-gp,ptot/TOTAL_NEED*100);
  bars+=`<div class="bar-row" style="margin-top:20px;padding-top:14px;border-top:1px dashed var(--line)"><div class="bar-head"><b>총 학점</b><span>${tot} <span class="plan-txt">+${ptot}</span> = ${tot+ptot} / ${TOTAL_NEED}학점 ${tot+ptot>=TOTAL_NEED?'<span class="plan-txt">✓ 계획대로면 충족</span>':`(${TOTAL_NEED-tot-ptot}학점 더 필요)`}</span></div>
  <div class="bar" style="height:14px"><i style="width:${gp}%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px 0 0 99px"></i><i style="width:${pp}%;background:#fbbf77"></i></div></div>`;
  $("planBars").innerHTML=bars;

  let pts=0,crs=0;
  db.forEach(c=>{const g=GRADES[c.grade];if(g!=null){pts+=g*c.cr;crs+=c.cr}});
  let egSet=false;
  plan.forEach(p=>{if(p.eg!=="미정"){pts+=GRADES[p.eg]*p.cr;crs+=p.cr;egSet=true}});
  const proj=crs?(pts/crs):null;
  const ptotAll=plan.reduce((s,c)=>s+c.cr,0);
  $("planSummary").innerHTML=
    `계획 과목: <b>${plan.length}과목 ${ptotAll}학점</b>`+
    (egSet?` · 예상 성적 반영 시 전체 평점: <b>${fmt(proj)}</b> (현재 ${fmt(gpa(db))})`:"");
}

function renderPlanList(){
  if(!plan.length){$("planList").innerHTML='<div class="empty">아직 담은 과목이 없어요. 위에서 과목을 담아보세요!</div>';return;}
  let html="";
  SEMS.forEach(s=>{
    const list=plan.filter(p=>p.sem===s);
    if(!list.length)return;
    const cr=list.reduce((a,c)=>a+c.cr,0);
    html+=`<div class="sem-title">${semLabel(s)}<span>${cr}학점 계획${cr>CREDIT_CAP?` · <b style="color:var(--red)">${CREDIT_CAP}학점 초과!</b>`:""}</span></div>
    <table><tr><th style="width:36%">과목명</th><th>구분</th><th>학점</th><th>학기</th><th>예상성적</th><th></th></tr>`;
    list.forEach(p=>{
      const fuChk=isDual(p)?`<div style="font-size:11px;margin-top:2px"><label title="체크하면 이 과목 학점이 원래 이수구분에서 빠지고 융합전공 학점으로 계산됩니다 (한도 ${FUSION_CAP}학점)" style="display:inline;color:var(--orange);cursor:pointer"><input type="checkbox" style="width:auto;vertical-align:-2px" ${p.fu?"checked":""} onchange="toggleFuP(${p.id})"> 융합전공 중복인정</label></div>`:"";
      html+=`<tr><td>${p.name}${fuChk}</td>
      <td><select onchange="chPlanType(${p.id},this.value)" style="color:${TYPE_COLOR[p.type]};font-weight:600">${TYPES.map(t=>`<option ${t===p.type?"selected":""}>${t}</option>`).join("")}</select></td>
      <td>${p.cr}</td>
      <td><select onchange="chPlanSem(${p.id},this.value)">${SEMS.map(x=>`<option ${x===p.sem?"selected":""}>${x}</option>`).join("")}</select></td>
      <td><select onchange="chEG(${p.id},this.value)">${EG.map(g=>`<option ${g===p.eg?"selected":""}>${g}</option>`).join("")}</select></td>
      <td><button class="del" onclick="unpick(${p.id})" title="빼기">✕</button></td></tr>`;
    });
    html+="</table>";
  });
  $("planList").innerHTML=html;
}
// ===== 커리큘럼 탭 =====
function currBtn(name){
  const taken=db.some(d=>d.name===name);
  const inPlan=plan.some(p=>p.name===name);
  return taken?'<button class="b-done">✓ 이수완료</button>':inPlan?'<button class="b-in">담김</button>':`<button class="b-pick" onclick="pick('${name.replace(/'/g,"\\'")}')">+ 담기</button>`;
}
function renderCurr(){
  const groups=[["1-1","1학년 1학기"],["1-2","1학년 2학기"],["2-1","2학년 1학기"],["2-2","2학년 2학기"],
    ["3-1","3학년 1학기"],["3-2","3학년 2학기"],["4-1","4학년 1학기"],["4-2","4학년 2학기"],
    ["계절","계절학기"],["","전학년 / 학기 무관"]];
  let html="";
  groups.forEach(([sem,label])=>{
    const list=CATALOG.filter(c=>c[3]===sem);
    if(!list.length)return;
    const done=list.filter(c=>db.some(d=>d.name===c[0])).length;
    html+=`<div class="sem-title">${label}<span>${list.length}과목 개설 · ${done}과목 이수</span></div><div class="cat-list" style="max-height:none">`;
    list.forEach(c=>{
      html+=`<div class="cat-item">
        <span class="tag" style="background:${TYPE_COLOR[c[2]]}18;color:${TYPE_COLOR[c[2]]}">${c[2]}</span>
        <div class="nm">${c[0]}<div class="meta">${c[1]}학점${c[4]?' · <b style="color:var(--orange)">융합인정</b>':""}</div></div>
        ${currBtn(c[0])}</div>`;
    });
    html+="</div>";
  });
  $("currList").innerHTML=html;
}
function renderPlanAll(){renderPlan();renderPlanList();renderCat();renderCurr();}
function renderAll(){render();renderPlanAll();}
renderAll();
</script>
